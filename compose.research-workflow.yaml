# RES-638 live research workflow: fresh, isolated stores only. Never combine with another project.
# Canonical starts EMPTY; papers enter only through bounded open-access acquisition.
# A second fresh stack: `-p <new project>` plus RESEARCH_*_PORT overrides; old volumes are untouched.
name: dynamisrag-res638-research
x-postgres: &postgres
  image: postgres:18.6-alpine
  restart: unless-stopped
  environment: &database-env
    POSTGRES_USER: workspace_admin
    POSTGRES_PASSWORD: ${RESEARCH_ADMIN_PASSWORD:?set a new admin password}
    WORKSPACE_DB_PASSWORD: ${RESEARCH_OWNER_PASSWORD:?set a new owner password}
    WORKSPACE_READER_PASSWORD: ${RESEARCH_READER_PASSWORD:?set a new read-only password}
  healthcheck:
    test: [CMD-SHELL, "pg_isready -U workspace_admin -d postgres"]
    interval: 3s
    timeout: 3s
    retries: 30
services:
  canonical:
    <<: *postgres
    ports: ["127.0.0.1:${RESEARCH_CANONICAL_PORT:-55448}:5432"]
    volumes:
      - canonical:/var/lib/postgresql
      - ./infra/workspace/init-db.sh:/docker-entrypoint-initdb.d/10-workspace.sh:ro
  agent-state:
    <<: *postgres
    environment:
      <<: *database-env
      WORKSPACE_DB_PASSWORD: ${RESEARCH_AGENT_PASSWORD:?set a separate agent database password}
    ports: ["127.0.0.1:${RESEARCH_AGENT_PORT:-55449}:5432"]
    volumes:
      - agent-state:/var/lib/postgresql
      - ./infra/workspace/init-db.sh:/docker-entrypoint-initdb.d/10-workspace.sh:ro
  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    restart: unless-stopped
    ports: ["127.0.0.1:${RESEARCH_QDRANT_PORT:-16346}:6333"]
    volumes: ["vectors:/qdrant/storage"]
    environment:
      QDRANT__SERVICE__API_KEY: ${RESEARCH_QDRANT_KEY:?set a new Qdrant key}
      QDRANT__TELEMETRY_DISABLED: "true"
  tei:
    # Pinned CPU runtime and exact model revision; the identity is re-attested on every call.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    restart: unless-stopped
    command:
      - --model-id=Qwen/Qwen3-Embedding-0.6B
      - --revision=97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
      - --dtype=float32
      - --max-batch-tokens=2048
      - --max-client-batch-size=1
      - --tokenization-workers=1
    ports: ["127.0.0.1:${RESEARCH_TEI_PORT:-18083}:80"]
    volumes:
      # Model weights only (no corpus data); set an existing cache volume to avoid a re-download.
      - tei-model-cache:/data
volumes:
  canonical:
  agent-state:
  vectors:
  tei-model-cache:
    name: ${RESEARCH_TEI_CACHE_VOLUME:-dynamisrag-res638-research-tei-cache}
    external: ${RESEARCH_TEI_CACHE_EXTERNAL:-false}
