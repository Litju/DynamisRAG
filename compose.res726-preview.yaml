# Use after compose.research-workflow.yaml and compose.research-local.yaml.
services:
  qdrant:
    networks: [default, embedding, warm-embedding]
  api:
    depends_on: !override
      canonical: { condition: service_healthy }
      agent-state: { condition: service_healthy }
      qdrant: { condition: service_started }
    # DeepSeek V4.1 Flash through OpenCode Go, as in the owner stack. The preview is
    # reachable only by the owner (Vercel Authentication plus the preview account).
    environment: &preview-model
      DYNAMISRAG_RESEARCH_TEI_URL: http://dynamisrag-res638-local-tei-1:80
  worker:
    environment: *preview-model
  gateway:
    image: node:24-bookworm-slim
    user: node
    restart: unless-stopped
    init: true
    command: [node, /gateway/funnel.mjs]
    volumes:
      - ./apps/edge-gateway:/gateway:ro
    ports: ["127.0.0.1:18444:8080"]
    environment:
      PYTHON_API_ORIGIN: http://qdrant:8000
      IDENTITY_SECRET: ${DYNAMISRAG_AGENT_IDENTITY_SECRET}
      PREVIEW_EXPIRES_AT: ${DYNAMISRAG_PREVIEW_EXPIRES_AT:?Set an ISO expiry at most seven days ahead}
    depends_on:
      api: { condition: service_healthy }
networks:
  warm-embedding:
    name: dynamisrag-res638-local_embedding
    external: true
volumes:
  canonical:
    name: res726-vercel-canonical
  agent-state:
    name: res726-vercel-agent-state
  vectors:
    name: res726-vercel-vectors
