# Alembic configuration for DynamisRAG.
#
# The database URL is intentionally absent from this file. `alembic/env.py`
# reads it from `dynamisrag.config`, so migrations and the running application
# can never disagree about the target database, and the DSN never passes
# through configparser interpolation.
#
# Run from PowerShell in the repository root:
#
#     uv run alembic upgrade head
#     uv run alembic downgrade base
#     uv run alembic current

[alembic]
# %(here)s is the directory holding this file, so the location is correct
# regardless of the current working directory or of the drive it lives on.
script_location = %(here)s/alembic

# Appended to sys.path so `alembic` also works in an environment where the
# package has not been installed (for example a bare `pip install alembic`).
prepend_sys_path = .

# Deterministic revision filenames: <rev-id>_<short-slug>, no timestamp, so a
# migration keeps the same path across machines and across `alembic revision`
# invocations.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 48

# `os` selects os.pathsep, which is ';' on Windows and ':' on Linux. Required
# because `%(here)s` expands to a Windows drive path such as C:\... on Windows.
path_separator = os

# Apply the `sqlalchemy` loggers at WARNING so `alembic upgrade head` prints one
# line per migration and nothing else, on every platform.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
