[project]
name = "dynamisrag"
version = "0.1.0"
description = "Evaluation-first RAG platform for auditable retrieval and evidence-grounded AI."
readme = "README.md"
requires-python = "==3.12.*"
authors = [{ name = "DynamisRAG maintainers" }]
keywords = ["rag", "retrieval-augmented-generation", "evaluation", "opensearch", "postgresql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx2>=2.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
]

[project.scripts]
dynamisrag = "dynamisrag.__main__:main"

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynamisrag"]

# ---------------------------------------------------------------------------
# Ruff -- formatter and linter. `uv run ruff format` owns layout, so the linter
# is free to reject anything ambiguous.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "ASYNC",# flake8-async
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "FBT",  # flake8-boolean-trap
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "N",    # pep8-naming
    "PTH",  # flake8-use-pathlib
    "PIE",  # flake8-pie
    "PLC",  # pylint convention
    "PLE",  # pylint error
    "PLR",  # pylint refactor
    "PLW",  # pylint warning
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "TID",  # flake8-tidy-imports
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "PLR0913",  # argument count is handled by design review, not mechanically
    "PLR2004",  # comparison against literals is idiomatic in probe assertions
    "PLC0415",  # local imports are legitimate for optional-dependency isolation
    "RUF012",   # ClassVar annotations only matter for mutable class attributes
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = [
    "F401",     # `op` and `sa` are part of the Alembic revision template
]
"tests/**" = [
    "ANN401",   # tests parse third-party JSON payloads that are genuinely untyped
    "ARG001",   # pytest fixtures are injected by name
    "ARG002",
    "PLC2701",  # private imports are acceptable when asserting on internals
    "PLR0913",
    "PLR0917",
    "S101",     # `assert` is the assertion mechanism in tests
    "S105",     # local-only throwaway credentials appear in test fixtures
    "S106",
    "S108",     # hard-coded temporary ports are intentional in probe tests
]

[tool.ruff.lint.isort]
known-first-party = ["dynamisrag"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# Pyright -- strict static type checking. Nothing is exempt.
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests", "alembic"]
venvPath = "."
venv = ".venv"
exclude = ["**/__pycache__", ".venv", "alembic/versions"]
reportUnnecessaryTypeIgnoreComment = "error"
reportPrivateUsage = "error"
reportMissingTypeStubs = false

# ---------------------------------------------------------------------------
# Pytest -- `uv run pytest` runs the infrastructure-free suite; the live
# PostgreSQL/OpenSearch suite runs with `uv run pytest -m integration`.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `tests` is an importable package so helpers are shared as `tests._support`
# rather than through pytest's implicit rootdir/sys.path manipulation.
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers -m 'not integration'"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "integration: requires the live PostgreSQL and OpenSearch services from `docker compose up -d`",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/dynamisrag"]
branch = true
