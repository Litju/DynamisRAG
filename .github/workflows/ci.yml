name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a local run and a CI run resolve identically. `--locked` is passed
  # explicitly on each command instead of via UV_FROZEN, which uv refuses to
  # combine with the flag.
  UV_VERSION: "0.12.4"

jobs:
  quality:
    name: Lint, types, unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target, not an afterthought: this project is
        # developed natively on Windows and every documented developer command is
        # PowerShell, so the gates have to hold there too.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python 3.12.13
        run: uv python install 3.12.13

      - name: Verify the lockfile matches pyproject.toml
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Pyright (strict)
        run: uv run pyright

      - name: Unit tests
        run: uv run pytest

  browser:
    name: Browser research UI (Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python 3.12.13
        run: uv python install 3.12.13

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Install Chromium
        # `--with-deps` runs apt-get against the runner's Ubuntu mirrors. A transient DNS outage
        # there (observed on PR #34: "Temporary failure resolving 'archive.ubuntu.com'") fails
        # the job before any browser test executes, which says nothing about the application.
        # Retry the infrastructure step a bounded number of times; a real failure still fails.
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if uv run playwright install --with-deps chromium; then exit 0; fi
            echo "playwright install failed (attempt ${attempt}/3); retrying after backoff"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Browser end-to-end tests
        run: uv run pytest -q -o "addopts=-ra --strict-config --strict-markers" -m browser

  integration:
    name: Migrations, integration tests, live server
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Generate disposable PostgreSQL credentials
        shell: bash
        run: |
          admin_password="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          test_password="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          {
            echo "DYNAMISRAG_POSTGRES_PASSWORD=$admin_password"
            echo "DYNAMISRAG_DATABASE_URL=postgresql://dynamisrag:$admin_password@127.0.0.1:55433/dynamisrag"
            echo "DYNAMISRAG_TEST_DATABASE_URL=postgresql://dynamisrag_test:$test_password@127.0.0.1:55433/postgres"
            echo "DYNAMISRAG_TEST_ADMIN_DATABASE_URL=postgresql://dynamisrag:$admin_password@127.0.0.1:55433/postgres"
            echo "DYNAMISRAG_OPENSEARCH_URL=https://127.0.0.1:19200"
            echo "DYNAMISRAG_SCIENTIFIC_QDRANT_URL=http://127.0.0.1:16333"
          } >> "$GITHUB_ENV"

      - name: Create .env from the committed template
        # The template holds published, local-only development passwords, which
        # is precisely why they are safe to materialise on a throwaway runner.
        # Done before any other step so that every `docker compose` invocation,
        # including the `if: always()` cleanup steps, can resolve its variables.
        run: cp .env.example .env

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python 3.12.13
        run: uv python install 3.12.13

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Validate the isolated Research Edition Compose configuration
        run: docker compose --project-name dynamisrag-research-edition --env-file .env.research-edition.example --file compose.yaml --file compose.embedding.yaml --file compose.research-edition.yaml config --quiet

      - name: Start PostgreSQL 18, OpenSearch 3 and Qdrant 1.20
        # The overlay pins a separate project, named-volume namespace, and
        # PostgreSQL host port without touching the retained local stack.
        run: docker compose --project-name dynamisrag-integration --file compose.yaml --file compose.integration.yaml up -d --wait --wait-timeout 420

      - name: Show service state
        run: docker compose --project-name dynamisrag-integration --file compose.yaml --file compose.integration.yaml ps

      - name: Pin the isolated PostgreSQL cluster identity
        shell: bash
        run: |
          system_identifier="$(docker compose --project-name dynamisrag-integration --file compose.yaml --file compose.integration.yaml exec -T postgres psql -U dynamisrag -d postgres -Atc 'SELECT system_identifier::text FROM pg_control_system()')"
          test -n "$system_identifier"
          echo "DYNAMISRAG_TEST_CLUSTER_SYSTEM_IDENTIFIER=$system_identifier" >> "$GITHUB_ENV"

      - name: Provision the isolated least-privilege test role
        run: uv run --locked python scripts/provision_test_role.py

      - name: Integration tests
        run: uv run pytest -m integration -v

      - name: Verify Qdrant restart persistence without reinserting data
        run: |
          set -euo pipefail
          uv run python -m scripts.qdrant_persistence_probe snapshot --receipt .tmp/qdrant-before.json
          docker compose --project-name dynamisrag-integration --file compose.yaml --file compose.integration.yaml restart qdrant
          uv run python -m scripts.wait_qdrant --timeout-seconds 60 --port 16333
          uv run python -m scripts.qdrant_persistence_probe verify --receipt .tmp/qdrant-before.json

      - name: Exercise the real server over HTTP, including a dependency outage
        run: |
          set -euo pipefail
          uv run python -m dynamisrag &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT

          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/healthz; then break; fi
            sleep 2
          done

          echo "=== healthy: liveness ==="
          curl -fsS -D headers-live.txt -o live.json http://127.0.0.1:8000/healthz
          cat live.json
          grep -q '^cache-control: no-store' <(tr -d '\r' < headers-live.txt)
          grep -q '"status":"up"' live.json

          echo "=== healthy: readiness ==="
          curl -fsS -D headers-ready.txt -o ready.json http://127.0.0.1:8000/readyz
          cat ready.json
          grep -q '^cache-control: no-store' <(tr -d '\r' < headers-ready.txt)
          grep -q '"status":"up"' ready.json
          grep -q '"version":"18' ready.json
          grep -q '"version":"3' ready.json

          echo "=== search: invalid input is a 422 without touching the backend ==="
          invalid_code=$(curl -s -o invalid.json -w '%{http_code}' \
            'http://127.0.0.1:8000/search?q=%20%20&limit=5')
          echo "blank query=$invalid_code"
          test "$invalid_code" = "422"
          limit_code=$(curl -s -o limit.json -w '%{http_code}' \
            'http://127.0.0.1:8000/search?q=probiotic&limit=5000')
          echo "limit out of range=$limit_code"
          test "$limit_code" = "422"

          echo "=== search: healthy backend, no projection yet ==="
          # The canonical database is empty in CI, so no passage has ever been
          # projected and the query alias resolves to nothing. The assertion is
          # deliberately independent of pre-existing indexed data: it pins the
          # error contract and the cache policy, and accepts a ranked 200 if a
          # projection happens to exist. The ranked happy path is proven
          # deterministically by the integration suite against this same node.
          search_code=$(curl -s -o search.json -D headers-search.txt -w '%{http_code}' \
            'http://127.0.0.1:8000/search?q=probiotic&limit=5')
          cat search.json
          echo "search=$search_code"
          test "$search_code" = "200" -o "$search_code" = "503"
          grep -q '^cache-control: no-store' <(tr -d '\r' < headers-search.txt)
          if [ "$search_code" = "503" ]; then
            grep -q '"detail":"search is temporarily unavailable"' search.json
          fi

          echo "=== degraded: stop opensearch ==="
          docker compose --project-name dynamisrag-integration --file compose.yaml --file compose.integration.yaml stop opensearch
          live_code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/healthz)
          ready_code=$(curl -s -o degraded.json -w '%{http_code}' http://127.0.0.1:8000/readyz)
          search_down_code=$(curl -s -o search-down.json -w '%{http_code}' \
            'http://127.0.0.1:8000/search?q=probiotic')
          echo "liveness=$live_code readiness=$ready_code search=$search_down_code"
          cat degraded.json
          cat search-down.json
          test "$live_code" = "200"
          test "$ready_code" = "503"
          test "$search_down_code" = "503"
          grep -q '"detail":"search is temporarily unavailable"' search-down.json
          grep -q '"status":"down"' degraded.json
          grep -q '"opensearch":{"name":"opensearch","status":"down"' degraded.json
          grep -q '"postgres":{"name":"postgres","status":"up"' degraded.json

          echo "=== recovery: start opensearch ==="
          docker compose --project-name dynamisrag-integration --file compose.yaml --file compose.integration.yaml start opensearch
          for _ in $(seq 1 90); do
            if [ "$(curl -s -o recovered.json -w '%{http_code}' http://127.0.0.1:8000/readyz)" = "200" ]; then
              break
            fi
            sleep 5
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/readyz)" = "200"
          cat recovered.json
          grep -q '"opensearch":{"name":"opensearch","status":"up"' recovered.json

      - name: Reproduce licensed sample ingestion and citation-verified retrieval
        shell: bash
        run: |
          set -euo pipefail
          owner_password="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$owner_password"
          docker compose --project-name dynamisrag-integration --file compose.yaml --file compose.integration.yaml exec -T postgres \
            psql -U dynamisrag -d postgres --set ON_ERROR_STOP=1 --set owner_password="$owner_password" <<'SQL'
          CREATE ROLE dynamisrag_owner
            LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT
            PASSWORD :'owner_password';
          GRANT dynamisrag_migration_operators TO dynamisrag_owner;
          CREATE DATABASE dynamisrag_research OWNER dynamisrag_owner;
          SQL
          database_oid="$(docker compose --project-name dynamisrag-integration --file compose.yaml --file compose.integration.yaml exec -T postgres \
            psql -U dynamisrag -d postgres -Atc "SELECT oid::text FROM pg_database WHERE datname='dynamisrag_research'")"
          test -n "$database_oid"
          export DYNAMISRAG_DATABASE_URL="postgresql://dynamisrag_owner:${owner_password}@127.0.0.1:55433/dynamisrag_research"
          uv run --locked alembic -x "maintenance_target=dynamisrag_research:$database_oid" upgrade head
          workspace='.tmp/research-edition-sample-v1'
          mkdir -p "$workspace"
          cp docs/evidence/real-science-v1/embedding-manifest.json \
            docs/evidence/real-science-v1/query-manifest.json \
            docs/evidence/real-science-v1/receipt.json "$workspace/"
          uv run --locked python scripts/real_scientific_retrieval.py \
            ingest-sample --workspace "$workspace"
          uv run --locked python scripts/real_scientific_retrieval.py retrieve \
            --workspace "$workspace" \
            --qdrant-target integration \
            --receipt-sha256 8ede85766f656acccf7fd44b9c3fde627bd18289b74fe375dbf895d02ff4d240

      - name: Dump service logs
        if: always()
        run: docker compose --project-name dynamisrag-integration --file compose.yaml --file compose.integration.yaml logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose --project-name dynamisrag-integration --file compose.yaml --file compose.integration.yaml stop
